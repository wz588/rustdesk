name: Build Custom RustDesk Client

# Builds a Windows x64 portable RustDesk client for a self-hosted server.
#
# What this file fixes compared with the previous version of this workflow
# (11 runs, all failed):
#   1. `KyleMayes/install-llvm-action@v1` declared a Node runtime that current
#      runners no longer provide, so it died after 0 seconds and every later
#      step was skipped. Now pinned to v2.0.9 (same commit upstream uses).
#   2. vcpkg was only cloned, never `vcpkg install`-ed, so aom/opus/libvpx/
#      libyuv/ffmpeg were missing at link time. Dependencies are installed now.
#   3. The RustDesk custom Flutter engine was never swapped in. Without it the
#      build succeeds but the remote view renders black.
#   4. The flutter-rust bridge is now generated in its own Ubuntu job (Flutter
#      3.22.3) and consumed as an artifact, exactly like upstream. Generating
#      it inline on Windows was not how upstream builds this target.
#   5. `patches/config.rs.patch` and `patches/ui-disable-update.patch` were both
#      stale (they targeted a placeholder in place of the real public key,
#      constants that no longer exist, and a Dart file that is gone). They are
#      no longer used; see patches/apply-custom.ps1.
#   6. `--skip-portable-pack` skipped the packaging that turns the build into the
#      single self-extracting installer, so the run only produced a portable
#      folder. A dedicated step now runs libs/portable/generate.py and emits
#      rustdesk-<version>-install.exe - the same artifact `build.py` produces
#      locally, and the only Windows form that installs both the app and the
#      Windows service.
#
# Toolchain versions mirror the upstream Windows Flutter job in
# .github/workflows/flutter-build.yml. Do not bump them independently - a
# mismatched Flutter or vcpkg baseline is the usual cause of failures here.

permissions:
  contents: read

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  LLVM_VERSION: "15.0.6"
  RUST_VERSION: "1.75"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_TRIPLET: "x64-windows-static"
  ARTIFACT_NAME: RustDesk-Custom-Win64

jobs:
  # ---------------------------------------------------------------------------
  # Bridge generation. Mirrors .github/workflows/bridge.yml (default leg).
  # ---------------------------------------------------------------------------
  generate-bridge:
    name: Generate flutter-rust bridge
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Cache Bridge
        id: cache-bridge
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-${{ env.BRIDGE_FLUTTER_VERSION }}-${{ github.sha }}
          restore-keys: |
            bridge-${{ env.BRIDGE_FLUTTER_VERSION }}-
            bridge-

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # extended_text 14 needs a newer Dart than Flutter 3.22.3 ships.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  # ---------------------------------------------------------------------------
  # Windows x64 build. Step-for-step mirror of the upstream
  # `build-for-windows-flutter` x86_64 leg, minus signing and MSI. Produces the
  # portable folder and the single-file self-extracting installer.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows x64 (portable folder + installer)
    needs: [generate-bridge]
    # windows-2022, not windows-latest: the custom Flutter engine is copied into
    # the hostedtoolcache path, which upstream only validates on the 2022 image.
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Export GitHub Actions cache environment variables
        # Required by VCPKG_BINARY_SOURCES=clear;x-gha,readwrite below.
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        # flutter/flutter#155685: the stock Windows engine lacks the texture
        # renderer changes RustDesk needs. Skipping this produces a client that
        # builds and runs but shows a black remote screen.
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        # Flutter 3.24.5 needs upstream's dropdown-menu patch.
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ env.VCPKG_TRIPLET }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ env.VCPKG_TRIPLET }}-rel-out.log" || true
        shell: bash

      - name: Apply custom client modifications
        # Server address, server public key, and is_custom_client() -> true.
        # Replaces the two stale .patch files; see the script's header.
        shell: pwsh
        run: ./patches/apply-custom.ps1

      - name: Build rustdesk (portable folder)
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

      - name: Build the single-file installer (self-extracted exe)
        # This is exactly the packaging that --skip-portable-pack skips above. It
        # is a step-for-step mirror of upstream's "Build self-extracted
        # executable" (.github/workflows/flutter-build.yml).
        #
        # libs/portable/generate.py brotli-compresses every file under ./rustdesk
        # into data.bin; the rustdesk-portable-packer stub embeds that blob with
        # include_bytes! (libs/portable/src/bin_reader.rs), so the result is one
        # self-extracting executable.
        #
        # The name MUST end in "install.exe". Two independent places key off that
        # suffix, and both are required for the install + service flow:
        #   * libs/portable/src/main.rs: click_setup = name ends with
        #     "install.exe" -> wipes the extract dir, unpacks, then launches
        #     rustdesk.exe --install.
        #   * src/core_main.rs / src/common.rs is_setup(): the same suffix makes
        #     the client push --install and open the install wizard.
        # --install runs platform::windows::install_me(), whose command batch
        # embeds `sc create <app> ... --service` + `sc start` (get_create_service),
        # because this custom client never sets stop-service=Y. So this one .exe
        # installs both the application and the Windows service.
        shell: bash
        run: |
          # Upstream strips the legacy <dpiAware> line before packing;
          # res/manifest.xml is embedded by libs/portable/build.rs.
          sed -i '/dpiAware/d' res/manifest.xml
          VERSION=$(grep -m1 -E '^version = "' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "packaging version: $VERSION"
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./installer
          mv ./target/release/rustdesk-portable-packer.exe "./installer/rustdesk-${VERSION}-install.exe"
          ls -l ./installer

      - name: Package and upload the portable folder
        # Uploaded before verification on purpose: an hour of build time should
        # never be thrown away by a mistake in the check below.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./rustdesk
          if-no-files-found: error

      - name: Upload the single-file installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}-Install
          path: ./installer/*.exe
          if-no-files-found: error

      - name: Verify customisation landed in the binary
        shell: pwsh
        run: |
          # rustdesk.exe here is only the Flutter C++ runner - it calls
          # LoadLibraryA("librustdesk.dll") and contains no Rust code at all.
          # build.py builds the Rust core with `cargo build --lib`, so every
          # string we patch lives in librustdesk.dll. Scanning rustdesk.exe
          # (as an earlier revision of this step did) can never succeed.
          $Server   = 'rustdesk.newdebao.com'
          $Official = 'rs-ny.rustdesk.com'
          # iso-8859-1 maps one byte to one char, so Contains() is a byte search.
          $Latin1 = [System.Text.Encoding]::GetEncoding(28591)

          Get-ChildItem .\rustdesk -Recurse -File |
            Select-Object @{n = 'Rel'; e = { $_.FullName.Substring((Resolve-Path .\rustdesk).Path.Length + 1) } },
                          @{n = 'MB'; e = { [math]::Round($_.Length / 1MB, 2) } } |
            Sort-Object MB -Descending |
            Format-Table -AutoSize

          $scanned = Get-ChildItem .\rustdesk -Recurse -File |
            Where-Object { $_.Extension -in @('.exe', '.dll') }
          if ($scanned.Count -eq 0) { throw 'no .exe/.dll found under .\rustdesk' }

          $rows = foreach ($f in $scanned) {
            $text = $Latin1.GetString([System.IO.File]::ReadAllBytes($f.FullName))
            [pscustomobject]@{
              File     = $f.Name
              Server   = $text.Contains($Server)
              Official = $text.Contains($Official)
            }
          }
          $rows | Format-Table -AutoSize

          $hitOfficial = @($rows | Where-Object { $_.Official })
          if ($hitOfficial.Count -gt 0) {
            throw ("official rendezvous server string is still present in: " +
                   (($hitOfficial | ForEach-Object { $_.File }) -join ', '))
          }
          $hitServer = @($rows | Where-Object { $_.Server })
          if ($hitServer.Count -eq 0) {
            throw "customisation did not land: '$Server' is absent from every built .exe/.dll"
          }
          Write-Host ("customisation verified in: " + (($hitServer | ForEach-Object { $_.File }) -join ', '))
